  - id: WANd.ORCH.OUTCOME_RELAY.001
    title: Parent Outcome Relay after Agent artifact
    domain: execution
    description: >
      When Agent() tool_result carries quotation artifact (output_path / .xlsx / filled_count),
      wande-orchestrator final user reply must include path and success count. Stop hook
      strategy A: nudge once then deterministic-forward REJECT; escalate after max blocks.
      v2 (2026-07-16): also covers query-type results (delivery_kind=query) — price/stock
      tables without a file artifact; parent must relay key codes/figures. Error payloads
      and bare no-result JSON stay out of the gate.
    code:
      - ccb-installer/config/skills/ccb-subagent-gate/scripts/lib/parse_transcript_outcome_relay.py
      - ccb-installer/config/skills/ccb-subagent-gate/scripts/validators/outcome-relay.sh
      - ccb-installer/packages/vertical/com.wanding.trade/agents/wande-orchestrator.md
    tests:
      - ccb-installer/config/skills/ccb-subagent-gate/tests/test_outcome_relay_gate.py
      - eval/agent_eval_cases.jsonl#orchestrator-fill-outcome-relay
      - eval/agent_eval_cases.jsonl#orchestrator-query-outcome-relay
    spec:
      - .trellis/spec/integration/agents-unified-model.md
      - .trellis/tasks/07-15-07-15-orchestrator-outcome-relay/research/root-cause-relay.md
      - .trellis/tasks/07-15-07-15-orchestrator-outcome-relay/research/root-cause-empty-wakeup.md
    related:
      - WANd.RUN.EXECUTION.001
      - WANd.ROUTING.ASSIGNMENT.001
      - WANd.ORCH.WAKEUP_RELAY.001

  - id: WANd.ORCH.WAKEUP_RELAY.001
    title: Empty trigger turn is a dispatch-completion signal
    domain: execution
    description: >
      When wande-orchestrator is woken by a turn with no new user text (background Agent
      completion wakeup), it must treat it as a dispatch-completion signal: check the latest
      Agent() tool_result and relay any un-relayed business result (prices, stock, tables,
      paths, no-match conclusions) before anything else. Never describe the empty turn as a
      user action and never assume the previous question was already answered. Root cause:
      claude-agent-acp background dispatch wakes the parent with an empty user turn; the old
      L1 ban on mentioning "empty message" suppressed the correct relay behavior. Companion
      rule: ADMISSION.001 requires explicit run_in_background:false so the wakeup path should
      not occur under foreground dispatch.
    code:
      - ccb-installer/packages/vertical/com.wanding.trade/agents/wande-orchestrator.md
    tests:
      - eval/agent_eval_cases.jsonl#orchestrator-query-outcome-relay
    spec:
      - .trellis/tasks/07-15-07-15-orchestrator-outcome-relay/research/root-cause-empty-wakeup.md
    related:
      - WANd.ORCH.OUTCOME_RELAY.001
      - WANd.RUN.ADMISSION.001

