# WanD agent runtime domain contracts
# Format inspired by Rudder doc/product registry.yml
# Maintainer: update when routing / execution / observability behavior changes

contracts:
  - id: WANd.ENTRY.IDENTITY.001
    title: Default session is employee primary entry
    domain: entry
    description: >
      wande-orchestrator identity is the employee's primary work assistant /
      default entry. Agent() routing is a capability, not the sole identity.
    code:
      - ccb-installer/packages/vertical/com.wanding.trade/agents/wande-orchestrator.md
      - ccb-installer/packages/vertical/com.wanding.trade/agents/wande-orchestrator.aionui.json
    tests:
      - manual#default-session-who-are-you
    spec:
      - .trellis/spec/integration/agent-team-architecture.md
      - .trellis/tasks/07-11-orchestrator-employee-primary-entry/prd.md

  - id: WANd.ENTRY.INTENT_SPLIT.001
    title: Personal/workbench vs business intent split
    domain: entry
    description: >
      Personal/workbench intents use profile/memory/clarify; task lists and
      mutations delegate to work-tasks-agent. Business/domain intents delegate
      to specialists. Main entry does not self-answer task inventories in v1.
    code:
      - ccb-installer/packages/vertical/com.wanding.trade/agents/wande-orchestrator.md
    tests:
      - manual#intent-split-tasks-vs-quote
    spec:
      - .trellis/spec/integration/agent-team-architecture.md
      - .trellis/tasks/07-11-orchestrator-employee-primary-entry/prd.md

  - id: WANd.ENTRY.EXTENSION.001
    title: Entry tools are additive extension slots
    domain: entry
    description: >
      Future skills / thin employee MCP / EIL role bias may be added without
      re-locking identity as router-only. Business MCP remain forbidden on entry.
    code:
      - .trellis/tasks/07-11-orchestrator-employee-primary-entry/research/extension-slots.md
    tests: []
    spec:
      - .trellis/tasks/07-11-orchestrator-employee-primary-entry/prd.md

  - id: WANd.ROUTING.ASSIGNMENT.001
    title: Entry agent delegates business work via Agent(subagent_type)
    domain: routing
    rudder_ref: ROUTING.ASSIGNMENT.001
    description: >
      Employee primary entry (wande-orchestrator) must not call business MCP at
      top level; it uses Agent() routing as a tool to send quotation/accurate/
      office/work-tasks/research work to the matching specialist.
    code:
      - ccb-installer/src/services/acp/agentSessionProfile.ts
      - ccb-installer/packages/vertical/com.wanding.trade/agents/wande-orchestrator.md
    tests:
      - ccb-installer/src/services/acp/__tests__/agentSessionProfile.test.ts
      - eval/agent_eval_cases.jsonl#orchestrator-quote-delegates
      - eval/agent_eval_cases.jsonl#orchestrator-accurate-delegates
    spec:
      - .trellis/spec/integration/work-routing-execution-contracts.md
      - .trellis/spec/integration/agent-team-architecture.md

  - id: WANd.ROUTING.ASSIGNMENT.002
    title: Orchestrator MCP server strip at session/new
    domain: routing
    description: Business MCP configs removed from orchestrator session; specialists keep L3.
    code:
      - ccb-installer/src/services/acp/agentSessionProfile.ts
    tests:
      - ccb-installer/src/services/acp/__tests__/agentSessionProfile.test.ts
    spec:
      - .trellis/spec/integration/agents-unified-model.md

  - id: WANd.ROUTING.ASSIGNMENT.003
    title: Delegatable agent catalog injection
    domain: routing
    description: Router prompt includes auto-generated delegation index from filterDelegatableCustomAgents.
    code:
      - ccb-installer/src/services/acp/agentSessionProfile.ts
    tests:
      - eval/agent_eval_cases.jsonl#direct-quotation-card-no-delegation
    spec:
      - .trellis/spec/integration/agent-team-architecture.md

  - id: WANd.ROUTING.REVIEWER.001
    title: ROE delivery gate on specialist Stop
    domain: routing
    rudder_ref: ROUTING.REVIEWER.001
    description: Subagent Stop hook runs roe-judge via subagent-gate; blocks non-compliant delivery.
    code:
      - ccb-installer/config/agents/quotation-agent.md
      - ccb-installer/scripts/hooks/subagent-gate.sh
    tests:
      - eval/agent_eval_cases.jsonl
    spec:
      - .trellis/spec/integration/agents-unified-model.md
      - .trellis/spec/integration/agent-hooks-overview.md
    related:
      - WANd.RUN.EXECUTION.001

  - id: WANd.ORG.MUTATE.UX.001
    title: Org mutate preview/apply envelope
    domain: org-mutate
    description: >
      Unified preview→confirm→apply→audit protocol for org DB mutates
      (knowledge, price, supplier). Knowledge is first implementer;
      price/supplier keep legacy fields with progressive aliasing.
      Append and delete both require same-turn preview synthesis.
    code:
      - python/admin/org_knowledge_payloads.py
      - python/admin/org_knowledge_dispatch.py
      - mcp_servers/quotation-server/dist/index.js
    tests:
      - python/admin/test_org_knowledge_mutate.py
    spec:
      - .trellis/spec/integration/org-mutate-ux.md
      - .trellis/tasks/07-14-kb-business-completeness/prd.md
      - .trellis/tasks/07-15-kb-mutate-conversation-ux/prd.md
    related:
      - WANd.KB.MCP.DELETE.001
      - WANd.KB.MCP.APPEND_BUDGET.001
      - WANd.ORG.MUTATE.CONFIRM.001
      - WANd.ORG.MUTATE.PARITY.001
      - WANd.LEARNING.PROMOTION.001

  - id: WANd.ORG.MUTATE.CONFIRM.001
    title: Org mutate confirm vocabulary (chat)
    domain: org-mutate
    description: >
      One-round Accept vocab for confirmed=true after preview
      (确认/同意/ok/好的/可以/是/落库/删除-in-context). Reject
      ambiguous chat and re-asking after Accept.
    code:
      - ccb-installer/packages/vertical/com.wanding.trade/agents/quotation-agent.md
    tests:
      - manual#kb-mutate-confirm-vocab-smoke
    spec:
      - .trellis/spec/integration/org-mutate-ux.md
      - .trellis/spec/integration/org-knowledge.md
    related:
      - WANd.ORG.MUTATE.UX.001

  - id: WANd.ORG.MUTATE.PARITY.001
    title: UI vs MCP org mutate business parity
    domain: org-mutate
    description: >
      UI chrome may differ from chat confirm; envelope/error_code/RBAC/
      locator/budget must stay aligned with configured Org Mutate logic.
    code:
      - python/admin/org_knowledge_mutate.py
      - python/admin/org_knowledge_client.py
    tests:
      - python/admin/test_org_knowledge_mutate.py
    spec:
      - .trellis/spec/integration/org-mutate-ux.md
    related:
      - WANd.ORG.MUTATE.UX.001
      - WANd.KB.MCP.DELETE.001

  - id: WANd.KB.MCP.DELETE.001
    title: Knowledge delete_business_rule (auditable)
    domain: org-mutate
    description: >
      MCP delete removes a Markdown rule block with block_id or
      content_hash+doc_version+snippet; keeps org revision history;
      apply gated by test slug / env flag / is_admin or org_knowledge.write
      from GET /api/auth/user; preview uses Org Mutate envelope;
      FORBIDDEN message is Chinese recovery copy.
    code:
      - python/admin/org_knowledge_client.py
      - python/admin/org_knowledge_mutate.py
      - python/admin/org_knowledge_dispatch.py
      - mcp_servers/quotation-server/dist/index.js
    tests:
      - python/admin/test_org_knowledge_mutate.py
      - python/tests/test_quotation_mcp_tool_registry.py
    spec:
      - .trellis/spec/integration/org-mutate-ux.md
      - .trellis/tasks/07-14-kb-business-completeness/research/delete-locator-compat.md
    related:
      - WANd.ORG.MUTATE.UX.001
      - WANd.ORG.MUTATE.PARITY.001

  - id: WANd.KB.MCP.APPEND_BUDGET.001
    title: Knowledge append budget (no silent truncate/split)
    domain: org-mutate
    description: >
      Hard cap LIMIT_EXCEEDED; forbid multi-append of one semantic rule;
      near-duplicate returns NEAR_DUPLICATE without writing.
    code:
      - python/admin/org_knowledge_client.py
      - ccb-installer/packages/vertical/com.wanding.trade/agents/quotation-agent.md
    tests:
      - python/admin/test_org_knowledge_mutate.py
    spec:
