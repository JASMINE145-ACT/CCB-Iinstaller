name: forbidden-coupling

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Platform forbidden-coupling lint
        run: node ccb-installer/scripts/lint-platform-forbidden-coupling.mjs
      - name: Package registry lint
        run: node ccb-installer/scripts/build-package-registry.mjs
