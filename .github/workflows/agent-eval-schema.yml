name: agent-eval-schema

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Agent eval case schema + suite refs
        run: node eval/run-agent-eval.mjs
      - name: List suites (sanity)
        run: node eval/run-agent-eval.mjs --list-suites
