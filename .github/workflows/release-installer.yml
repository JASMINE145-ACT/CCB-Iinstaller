name: Build CCB Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell
        run: |
          echo "PowerShell version:"
          $PSVersionTable.PSVersion
          echo "Current directory:"
          Get-Location
          echo "Contents:"
          Get-ChildItem -Name

      - name: Install NSIS
        run: choco install nsis -y

      - name: Download resources
        shell: pwsh
        run: |
          Write-Host "=== Downloading resources ==="
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Contents:"
          Get-ChildItem -Name
          Write-Host "ccb-installer contents:"
          Get-ChildItem "ccb-installer" -Name
          Write-Host "scripts contents:"
          Get-ChildItem "ccb-installer/scripts" -Name
          & ".\ccb-installer\scripts\build-resources.ps1"

      - name: Build installer
        shell: pwsh
        run: |
          Write-Host "=== Building installer ==="
          Get-ChildItem "ccb-installer" -Recurse -Name | Select-Object -First 20

          # Check if NSIS is installed
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsisPath) {
            Write-Host "NSIS found at: $nsisPath"
            & $nsisPath "ccb-installer\installer.nsi"
          } else {
            Write-Host "NSIS not found at default path, trying chocolatey..."
            & "C:\ProgramData\chocolatey\bin\makensis.exe" "ccb-installer\installer.nsi"
          }

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CCB-Setup
          path: ccb-installer/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v1
        with:
          files: ccb-installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}